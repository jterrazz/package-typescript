name: Publish
run-name: Publish ${{ github.event.release.tag_name }}

# outside: npm's trusted publishing names this file (publish.yaml) on npmjs.com: renaming it
# stops publishing until the trusted publisher names the new file.
on:
    release:
        types: [created]

jobs:
    publish:
        name: Publish
        # invariant: npm's trusted publishing and provenance both take this OIDC token; no token is stored.
        permissions:
            contents: read
            id-token: write
        uses: jterrazz/studio-actions/.github/workflows/publish-npm.yaml@main
