description: refuses a kind at the root of a monorepo, and a root npm would publish
fixture: ./__fixtures__/config/monorepo-root-project/
env: TYPESCRIPT_CHECK_PASSES=config
runs:
    - command: check
      exit: 1
      stdout: |4
