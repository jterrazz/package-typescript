description: auto-ignores plugin and scoped addon devDependencies
fixture: ./fixtures/knip/plugin-deps/
runs:
    - command: check
      exit: 1
      # A knip fixture carries no tsconfig, so tsc prints its help and refuses —
      # the compiler's block, not this document's subject.
