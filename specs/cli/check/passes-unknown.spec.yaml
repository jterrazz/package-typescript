description: refuses a pass selector naming no pass, listing the passes
fixture: ./_fixtures/typechecker/invalid/
env: TYPESCRIPT_CHECK_PASSES=typescript,lint
runs:
    - command: check
      exit: 2
      stderr: |
          TYPESCRIPT_CHECK_PASSES names no pass: lint — the passes are config,typescript,oxlint,oxfmt,gitignore,knip,presets,docs,publish,architecture,astro,suppressions,markdown,names,comments,secrets,drift
