description: fails a project whose gitignore still names artefacts outside .artifacts/
fixture: ./__fixtures__/gitignore/old-layout/
env: TYPESCRIPT_CHECK_PASSES=gitignore
runs:
    - command: check
      exit: 1
      stdout: |4
