description: refuses a .jterrazz/baseline.json whose counts sit outside a section
fixture: ./__fixtures__/baseline/flat/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           RUN  Oxlint Check

          baseline-unreadable  .jterrazz/baseline.json  found: .jterrazz/baseline.json keys `eslint/no-debugger` to something that is not a section of counts · why: the ratchet reads its counts from that file, and a file it cannot read holds no debt it can judge · fix: correct .jterrazz/baseline.json until it is one JSON object of sections, or delete it and run 'typescript baseline' · read: docs/reference/quality-checks.md#the-ratchet
          ✗ Failed with exit code 1 ({{duration}})

           RUN  Oxfmt Check

          ✓ Passed ({{duration}})

           RUN  Knip (unused code)

          ✓ Passed ({{duration}})

           RUN  Suppressions (directives)

          ✓ Passed ({{duration}})

           RUN  Markdown (prose)

          ✓ Passed ({{duration}})

           RUN  Names (tree)

          ✓ Passed ({{duration}})

           RUN  Secrets (credentials)

          ✓ Passed ({{duration}})

           DRIFT  Deviations from the profile

            declared                              nothing — node, the default
            exceptions                            0
            rules off vs profile                  none
            suppressions                          0
            .jterrazz/oxlint-suppressions.json    nothing held
            .jterrazz/baseline.json › typescript  unreadable
            tool versions                         in range

           END  Finalizing quality checks

          ✗ Some checks failed — first Oxlint Check: baseline-unreadable  .jterrazz/baseline.json  found: .jterrazz/baseline.json keys `eslint/no-debugger` to something that is not a section of counts · why: the ratchet reads its counts from that file, and a file it cannot read holds no debt it can judge · fix: correct .jterrazz/baseline.json until it is one JSON object of sections, or delete it and run 'typescript baseline' · read: docs/reference/quality-checks.md#the-ratchet
    - command: baseline
      exit: 1
      stdout: |4
           TYPESCRIPT  Recording the baseline...

          found: .jterrazz/baseline.json keys `eslint/no-debugger` to something that is not a section of counts · why: the typescript section is written beside the others, and a file that cannot be read as sections would lose them · fix: correct .jterrazz/baseline.json until it is one JSON object of sections, or delete it, then run again · read: docs/reference/quality-checks.md#recording-it
