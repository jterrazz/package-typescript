description: refuses comment lines fallen below the recorded count, until fix re-records the fall
fixture: ./_fixtures/comments/fell/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check

