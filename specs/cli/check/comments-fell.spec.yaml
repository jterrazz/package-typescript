          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Comments (density)

          re-recorded jterrazz.baseline.json › typescript › comments/comment-lines-held-by-the-baseline 3 → 2
          ✓ Passed

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          jterrazz.baseline.json:
              equals: |
                  {
                      "typescript": {
                          "comments/comment-lines-held-by-the-baseline": 2
                      }
                  }
