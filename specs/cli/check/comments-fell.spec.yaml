          ✓ Passed

           RUN  Comments (density)

          comments/comment-lines-held-by-the-baseline  jterrazz.baseline.json › typescript  found: 2 comment lines — 50% of 4 source lines, below the 3 recorded · why: the default is no comment — a name carries the meaning, and the count is held exactly so no comment arrives unseen, and slack left in the entry would let one arrive · fix: run 'typescript fix', which re-records the fall · read: docs/06-quality-checks.md#the-comments-density-pass
          ✗ Failed with exit code 1

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
