description: keeps a baseline section emptied of every entry apart from an absent one, for a machine
fixture:
    - ./_fixtures/drift/project/
    - ./_fixtures/drift/emptied-section/
env: TYPESCRIPT_CHECK_PASSES=drift
runs:
    - command: check --json
      exit: 0
      stdout: |4
           START  Running quality checks

           DRIFT  Deviations from the profile

          {
            "baseline": 0,
            "config": "default",
            "floors": {},
            "optOuts": [],
            "oxlintSuppressions": null,
            "profile": "node",
            "rulesOff": [],
            "suppressions": 0,
            "sections": {},
            "tools": [],
            "unreasoned": []
          }

           END  Finalizing quality checks

          ✓ All checks passed
