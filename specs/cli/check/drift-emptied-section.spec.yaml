description: reports no section, and passes, when the baseline's typescript section is emptied (--json)
fixture:
    - ./_fixtures/drift/project/
    - ./_fixtures/drift/emptied-section/
env: TYPESCRIPT_CHECK_PASSES=drift
runs:
    - command: check --json
      exit: 0
      stdout: |4
           START  Running quality checks

           DRIFT  Deviations from the profile

          {
            "baseline": 0,
            "declaration": null,
            "floors": {},
            "optOuts": [],
            "oxlintSuppressions": null,
            "rulesOff": [],
            "suppressions": 0,
            "sections": {},
            "tools": []
          }

           END  Finalizing quality checks

          ✓ All checks passed
