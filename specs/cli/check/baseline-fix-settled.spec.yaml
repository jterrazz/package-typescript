description: drops the entry a fix run finds at zero, on a tree that owes nothing
fixture: ./fixtures/baseline/settled/
runs:
    # oxlint itself exits 0 here: the fixer leaves a clean tree. The ratchet
    # moved and the entry stayed, and a paid debt is a fall the fix records:
    # the entry goes, the pass names it, and the run is green.
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Fix

          re-recorded jterrazz.baseline.json › typescript › eslint/no-debugger 2 → 0
          ✓ Passed

           RUN  Oxfmt Format

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          jterrazz.baseline.json:
              equals: |
                  {
                      "typescript": {}
                  }
    # The section the fix emptied is still the project's ratchet: a green check
    # names it as holding nothing, the phrase @jterrazz/test gives its own.
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check

          jterrazz.baseline.json › typescript: nothing held
          ✓ Passed

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           END  Finalizing quality checks

          ✓ All checks passed
