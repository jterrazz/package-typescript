description: an export used only in its own file is not unused, with no local knip.json
fixture: ./__fixtures__/knip/same-file-export/
env: TYPESCRIPT_CHECK_PASSES=knip
runs:
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  Knip (unused code)

          ✓ Passed ({{duration}})

           END  Finalizing quality checks

          ✓ All checks passed
