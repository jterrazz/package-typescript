description: passes fix and check alike on a project whose diagnostics stand at the counts it recorded
fixture: ./fixtures/baseline/within/
runs:
    # The pair, on one tree: the two `debugger` statements are errors, so
    # oxlint's own exit code is 1 in either mode and only the ratchet makes
    # the run green. Judging only `check` by the baseline made
    # `make fix && make check` print red then green wherever a project kept one.
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Fix

          ✓ Passed

           RUN  Oxfmt Format

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           END  Finalizing quality fixes

          ✓ All checks passed
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check

          jterrazz.baseline.json › typescript: 2 held across 1 rule
          ✓ Passed

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            jterrazz.baseline.json › typescript  2
            tool versions                        in range

           END  Finalizing quality checks

          ✓ All checks passed
