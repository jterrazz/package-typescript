description: reads a baseline that is not JSON as unreadable, and claims no section it never read
fixture:
    - ./__fixtures__/drift/project/
    - ./__fixtures__/drift/unreadable-baseline/
env: TYPESCRIPT_CHECK_PASSES=drift
runs:
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           DRIFT  Deviations from the profile

            declared                              nothing — node, the default
            exceptions                            0
            rules off vs profile                  none
            suppressions                          0
            .jterrazz/oxlint-suppressions.json    nothing held
            .jterrazz/baseline.json › typescript  unreadable
            tool versions                         in range

           END  Finalizing quality checks

          ✓ All checks passed
    - command: check --json
      exit: 0
      stdout: |4
           START  Running quality checks

           DRIFT  Deviations from the profile

          {
            "baseline": "unreadable",
            "declaration": null,
            "exceptions": 0,
            "members": {},
            "mutationDirectives": 0,
            "optOuts": [],
            "oxlintSuppressions": null,
            "rulesOff": [],
            "suppressions": 0,
            "sections": {},
            "tools": []
          }

           END  Finalizing quality checks

          ✓ All checks passed
