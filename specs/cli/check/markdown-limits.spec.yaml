description: fails a page whose prose, fence and section run past the readability limits
fixture: ./__fixtures__/markdown/walls/
env: TYPESCRIPT_CHECK_PASSES=markdown
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  Markdown (prose)

          README.md:1:1: error markdown(prose-block-is-short): a block of 13 lines at line 5, over the limit of 12
          README.md:1:1: error markdown(fenced-run-is-short): a fenced block at line 21 runs 16 lines unbroken, over the limit of 15; a blank line after line 29 survives the formatter
          README.md:1:1: error markdown(long-section-has-subheadings): "## A section with nothing to break it up" at line 40 runs 31 lines of prose with no ### and no list
          ✗ Failed with exit code 1 ({{duration}})

           END  Finalizing quality checks

          ✗ Some checks failed, first Markdown (prose): README.md:1:1: error markdown(prose-block-is-short): a block of 13 lines at line 5, over the limit of 12
