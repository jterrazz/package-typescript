description: fails a warn-severity diagnostic, naming the promotion no baseline can replace, in check and in fix
fixture: ./__fixtures__/warnings/warned/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           RUN  Oxlint Check
          {{any}}
          found: a warn-severity diagnostic — oxlint lists it above · why: .jterrazz/oxlint-suppressions.json holds errors alone, so no baseline can hold a warning down and it fails the pass on every run · fix: set the rule to `error` in the config that arms it, then fix the diagnostic or run 'typescript baseline' to record it · read: docs/reference/quality-checks.md#a-warning-is-a-diagnostic
