description: reads a warn-severity diagnostic as debt, and reads it the same way in check and in fix
fixture: ./_fixtures/warnings/unrecorded/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check
          {{any}}
          ✗ Failed with exit code 1

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Comments (density)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            oxlint-suppressions.json             nothing held
            jterrazz.baseline.json › typescript  nothing held
            tool versions                        in range

           END  Finalizing quality checks

          ✗ Some checks failed
    - command: fix
      exit: 1
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Fix
          {{any}}
          ✗ Failed with exit code 1

           RUN  Oxfmt Format

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Comments (density)

          ✓ Passed

           END  Finalizing quality fixes

          ✗ Some checks failed
