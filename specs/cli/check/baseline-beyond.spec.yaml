description: fails a ratchet that moved the wrong way, a rule that owes nothing, and debt nobody recorded
fixture: baseline/beyond/
runs:
    - command: check
      exit: 1
      # The oxlint pass prints the linter's own report, and that block has no
      # fixed shape: oxlint picks its reporter from the environment — GitHub
      # workflow commands under GITHUB_ACTIONS, one compact line per diagnostic
      # under an AI agent, miette's framed rendering in a terminal — and its
      # threads finish in whatever order they finish. That is the linter's, not
      # this document's subject. What is claimed here is the ratchet's verdict,
      # which is ours and is ordered; it already states how many diagnostics
      # each rule has.
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check
          {{any}}
          baseline-ratchet  oxlint.baseline.json  eslint/no-debugger is at 2, above its baseline of 1
          baseline-ratchet  oxlint.baseline.json  eslint/no-unused-vars has 1 diagnostic(s) and no entry — it is new debt
          baseline-ratchet  oxlint.baseline.json  eslint/no-var is at zero — the ratchet moved, delete its entry
          Run 'typescript baseline' to record where the project actually stands.
          ✗ Failed with exit code 1

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           END  Finalizing quality checks

          ✗ Some checks failed
