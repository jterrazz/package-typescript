description: fails a fix run whose surviving diagnostics break the ratchet
fixture: ./__fixtures__/baseline/beyond/
runs:
    - command: fix
      exit: 1
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           RUN  Oxlint Fix
          {{any}}
          ✗ Failed with exit code 1 ({{duration}})

           RUN  Oxfmt Format

          ✓ Passed ({{duration}})

           RUN  Suppressions (directives)

          ✓ Passed ({{duration}})

           RUN  Markdown (prose)

          ✓ Passed ({{duration}})

           RUN  Names (tree)

          ✓ Passed ({{duration}})

           END  Finalizing quality fixes

          ✗ Some checks failed, first Oxlint Fix: {{any}}
      files:
          .jterrazz/oxlint-suppressions.json:
              equals: |
                  {
                      "index.ts": {
                          "no-debugger": {
                              "count": 1
                          }
                      }
                  }
