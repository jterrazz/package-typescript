description: fails a fix run whose surviving diagnostics break the ratchet
fixture: ./fixtures/baseline/beyond/
runs:
    - command: fix
      exit: 1
      # The oxlint pass prints the linter's own report, and that block has no
      # fixed shape ([Testing](../../../docs/03-testing.md)). What is claimed
      # here is the ratchet's verdict on what SURVIVED the fixer, which is ours
      # and is ordered: the paid entry is dropped, and the rule that rose and
      # the rule with no entry are left for `typescript baseline` — a fix never
      # records debt that grew.
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Fix
          {{any}}
          re-recorded jterrazz.baseline.json › typescript › eslint/no-var 3 → 0
          baseline-ratchet  jterrazz.baseline.json › typescript  eslint/no-debugger is at 2, above its baseline of 1
          baseline-ratchet  jterrazz.baseline.json › typescript  eslint/no-unused-vars has 1 diagnostic(s) and no entry — it is new debt
          Run 'typescript baseline' to record where the project actually stands.
          ✗ Failed with exit code 1

           RUN  Oxfmt Format

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           END  Finalizing quality fixes

          ✗ Some checks failed
      files:
          jterrazz.baseline.json:
              equals: |
                  {
                      "typescript": {
                          "eslint/no-debugger": 1
                      }
                  }
