description: fails a package whose build fails, naming the failure, and still runs publint and attw
fixture: ./fixtures/publish/broken-build/
runs:
    - command: check
      exit: 1
      # The `files` line and the build line come before publint's own
      # report, which opens on its version — a block that belongs to the
      # tool. That report is here to show the pass ran on past the build.
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check

          jterrazz.baseline.json › typescript: nothing held
          ✓ Passed

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Publish (packaging)

          publish-files  package.json  ./greeter.js is outside "files" — it resolves here and 404s in a consumer
          publish-build  package.json  found: the build failed — [UNRESOLVED_ENTRY] Cannot resolve entry module src/index.ts. · why: the build guard reads what the build compiles, and a build that fails leaves nothing to judge · fix: make the build pass — its own tsdown.config, else `typescript bundle` · read: @jterrazz/typescript's docs/06-quality-checks.md#the-build-guard
          {{any}}
          Packing files with `npm pack`...
          Linting...
          Errors:
          1. pkg.exports["./greeter"] is ./greeter.js but the file is not published. Is it specified in pkg.files?
          ✗ Failed with exit code 1

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            jterrazz.baseline.json › typescript  absent
            tool versions                        in range

           END  Finalizing quality checks

          ✗ Some checks failed
