description: refuses comment lines no entry records, until baseline records them
fixture: ./_fixtures/comments/unrecorded/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

