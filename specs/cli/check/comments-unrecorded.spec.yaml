           RUN  Comments (density)

          comment-lines  jterrazz.baseline.json › typescript  found: 2 comment lines — 50% of 4 source lines, and no `comments/comment-lines` entry records them · why: the default is no comment — a name carries the meaning, and the count is held exactly so no comment arrives unseen · fix: delete the comments a name can carry, then run 'typescript baseline' to record the count that is left · read: docs/06-quality-checks.md#the-comments-density-pass
