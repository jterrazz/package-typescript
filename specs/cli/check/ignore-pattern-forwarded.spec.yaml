description: overlooks, in every gate that reads the tree, what --ignore-pattern names
fixture: ./_fixtures/ignore-pattern/notes-overlooked/
env: TYPESCRIPT_CHECK_PASSES=typescript,oxlint,oxfmt,suppressions,markdown,names,comments,secrets
runs:
    - command: check --ignore-pattern 'notes/**'
      exit: 2
      stderr: |
          TYPESCRIPT_CHECK_PASSES names no pass: comments — the passes are config,typescript,oxlint,oxfmt,gitignore,knip,presets,docs,publish,architecture,astro,suppressions,markdown,names,secrets,drift
    - command: fix --ignore-pattern 'notes/**'
      exit: 2
      stderr: |
          TYPESCRIPT_CHECK_PASSES names no pass: comments — the passes are config,typescript,oxlint,oxfmt,gitignore,knip,presets,docs,publish,architecture,astro,suppressions,markdown,names,secrets,drift
      files:
          notes/utils/scratch.ts:
              equals: |
                  // eslint-disable-next-line no-unused-vars
                  export function stop(): void {
                      debugger;
                  }
