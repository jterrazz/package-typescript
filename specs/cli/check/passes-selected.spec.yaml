description: runs and reports only the passes TYPESCRIPT_CHECK_PASSES names
fixture: ./_fixtures/typechecker/invalid/
env: TYPESCRIPT_CHECK_PASSES=typescript,oxfmt
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          types.ts(1,7): error TS2322: Type 'number' is not assignable to type 'string'.
          types.ts(2,7): error TS2322: Type 'string' is not assignable to type 'number'.
          ✗ Failed with exit code 1

           RUN  Oxfmt Check

          ✓ Passed

           END  Finalizing quality checks

          ✗ Some checks failed
