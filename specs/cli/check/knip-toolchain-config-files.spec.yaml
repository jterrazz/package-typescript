description: keeps oxlint.config.ts and oxfmt.config.ts entries when the tools are not a direct dependency
fixture: knip/toolchain-config-files/
runs:
    - command: check
      exit: 1
      # A knip fixture carries no tsconfig, so tsc prints its help and refuses —
      # the compiler's block, not this document's subject.
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          {{any}}

          ✗ Failed with exit code 1

           RUN  Oxlint Check

          ✓ Passed

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           END  Finalizing quality checks

          ✗ Some checks failed
