description: keeps a root declared verbatim as written through check and fix
fixture: ./__fixtures__/verbatim-root/
env: TYPESCRIPT_CHECK_PASSES=typescript,oxlint,oxfmt,suppressions,markdown,names,comments,secrets
runs:
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           RUN  Oxlint Check

          ✓ Passed ({{duration}})

           RUN  Oxfmt Check

          ✓ Passed ({{duration}})

           RUN  Suppressions (directives)

          ✓ Passed ({{duration}})

           RUN  Comments (styles, scripts, YAML)

          ✓ Passed ({{duration}})

           RUN  Markdown (prose)

          ✓ Passed ({{duration}})

           RUN  Names (tree)

          ✓ Passed ({{duration}})

           RUN  Secrets (credentials)

          ✓ Passed ({{duration}})

           END  Finalizing quality checks

          ✓ All checks passed
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           RUN  Oxlint Fix

          ✓ Passed ({{duration}})

           RUN  Oxfmt Format

          ✓ Passed ({{duration}})

           RUN  Suppressions (directives)

          ✓ Passed ({{duration}})

           RUN  Comments (styles, scripts, YAML)

          ✓ Passed ({{duration}})

           RUN  Markdown (prose)

          ✓ Passed ({{duration}})

           RUN  Names (tree)

          ✓ Passed ({{duration}})

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          notes/rebuild.sh:
              equals: |
                  #!/bin/sh
                  # scratch: rebuild the notes
                  make build
          notes/utils/scratch.ts:
              equals: |
                  // eslint-disable-next-line no-unused-vars
                  export function stop(): void {
                      debugger;
                  }
