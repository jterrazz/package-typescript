description: fails the oxlint pass on a CommonJS config, which oxlint drops in silence
fixture: ./__fixtures__/oxlint-config/commonjs/
env: TYPESCRIPT_CHECK_PASSES=oxlint
runs:
    - command: check
      exit: 1
      stdout: |4-
           START  Running quality checks

           RUN  Oxlint Check
          {{any}}
          oxlint-config-commonjs  oxlint.config.js  found: a CommonJS config cannot load an ESM preset or plugin · why: oxlint drops a config it cannot load and exits 0, so the run enforces no rule the config names · fix: write oxlint.config.ts or .mjs · read: docs/reference/quality-checks.md#the-two-refusals-that-are-not-diagnostics
          ✗ Failed with exit code 1 ({{duration}})

          {{any}}
