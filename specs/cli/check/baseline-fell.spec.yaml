description: fails a ratchet whose debt fell below what it recorded, until fix re-records it
fixture: ./_fixtures/baseline/fell/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check
          {{any}}
          baseline-ratchet  jterrazz.baseline.json › typescript  eslint/no-debugger is at 1, below its baseline of 2 — the debt fell, `typescript fix` re-records it
          Run 'typescript baseline' to record where the project actually stands.
          ✗ Failed with exit code 1

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          names/no-language-construct-name  src/types.ts  `types.ts` names a construct of the language — name it for the subject it holds
          baseline-ratchet  jterrazz.baseline.json › typescript  names/no-language-construct-name is at 1, below its baseline of 2 — the debt fell, `typescript fix` re-records it
          Run 'typescript baseline' to record where the project actually stands.
          ✗ Failed with exit code 1

           RUN  Comments (density)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            jterrazz.baseline.json › typescript  4
            jterrazz.baseline.json › test        3
            tool versions                        in range

           END  Finalizing quality checks

          ✗ Some checks failed
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Fix

          re-recorded jterrazz.baseline.json › typescript › eslint/no-debugger 2 → 1
          ✓ Passed

           RUN  Oxfmt Format

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          names/no-language-construct-name  src/types.ts  `types.ts` names a construct of the language — name it for the subject it holds
          re-recorded jterrazz.baseline.json › typescript › names/no-language-construct-name 2 → 1
          ✓ Passed

           RUN  Comments (density)

          ✓ Passed

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          jterrazz.baseline.json:
              equals: |
                  {
                      "typescript": {
                          "eslint/no-debugger": 1,
                          "names/no-language-construct-name": 1
                      },
                      "test": {
                          "jterrazz/some-rule": 3
