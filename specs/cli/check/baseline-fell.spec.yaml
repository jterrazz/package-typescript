description: fails a ratchet whose debt fell below what it recorded, until fix re-records it
fixture: ./_fixtures/baseline/fell/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check
          {{any}}
          found: oxlint-suppressions.json holds more than the project has left · why: the count is exact, so a debt that fell is recorded the day it falls · fix: run 'typescript fix', which prunes the file · read: docs/06-quality-checks.md#the-ratchet
          ✗ Failed with exit code 1

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          src/types.ts:1:1: error names(no-language-construct-name): found: `types.ts` names a construct of the language · why: A directory or file is named for its subject, never for a construct of the language. · fix: name it for the subject it holds · read: docs/06-quality-checks.md#the-names-tree-pass
          baseline-ratchet  jterrazz.baseline.json › typescript  found: `names/no-language-construct-name` is at 1, below its baseline of 2 · why: each count is held exactly, so a debt that fell is recorded the day it falls and cannot grow back unseen · fix: run 'typescript fix', which re-records the fall · read: docs/06-quality-checks.md#what-jterrazzbaselinejson-still-holds
          ✗ Failed with exit code 1

           RUN  Comments (density)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            oxlint-suppressions.json             2
            jterrazz.baseline.json › typescript  2
            jterrazz.baseline.json › test        nothing held
            tool versions                        in range

           END  Finalizing quality checks

          ✗ Some checks failed
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Fix

          ✓ Passed

           RUN  Oxfmt Format

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          src/types.ts:1:1: error names(no-language-construct-name): found: `types.ts` names a construct of the language · why: A directory or file is named for its subject, never for a construct of the language. · fix: name it for the subject it holds · read: docs/06-quality-checks.md#the-names-tree-pass
          re-recorded jterrazz.baseline.json › typescript › names/no-language-construct-name 2 → 1
          ✓ Passed

           RUN  Comments (density)

          ✓ Passed

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          jterrazz.baseline.json:
              equals: |
                  {
                      "typescript": {
                          "names/no-language-construct-name": 1
                      },
                      "test": {}
                  }
          oxlint-suppressions.json:
              equals: |
                  {
                      "index.ts": {
                          "no-debugger": {
                              "count": 1
                          }
                      }
                  }
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check

          ✓ Passed

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Comments (density)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            oxlint-suppressions.json             1
            jterrazz.baseline.json › typescript  1
            jterrazz.baseline.json › test        nothing held
            tool versions                        in range

           END  Finalizing quality checks

          ✓ All checks passed
