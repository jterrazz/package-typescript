description: passes the dashes of a page under a root declared verbatim, the author's text kept as written
fixture: ./__fixtures__/markdown/dashes-verbatim/
env: TYPESCRIPT_CHECK_PASSES=markdown
runs:
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  Markdown (prose)

          ✓ Passed ({{duration}})

           END  Finalizing quality checks

          ✓ All checks passed
