description: fails a suppressions file holding an entry for a file that is gone, until fix prunes it
fixture: ./__fixtures__/baseline/vanished/
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           RUN  Oxlint Check

          found: .jterrazz/oxlint-suppressions.json holds entries for files that are gone: src/moved.ts · why: the count is exact, so a debt that fell is recorded the day it falls · fix: run 'typescript fix', which prunes the file · read: docs/reference/quality-checks.md#the-ratchet
          ✗ Failed with exit code 1 ({{duration}})

           RUN  Oxfmt Check

          ✓ Passed ({{duration}})

           RUN  Knip (unused code)

          ✓ Passed ({{duration}})

           RUN  Suppressions (directives)

          ✓ Passed ({{duration}})

