description: fails a recorded crossing count that fell, until fix re-records it
fixture: ./_fixtures/architecture-map/fell/
env: TYPESCRIPT_CHECK_PASSES=architecture
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  Architecture (layer map)

          src/domain/user.ts:1:22: error architecture(domain-stays-pure): found: `src/domain/user.ts` imports `src/infrastructure/store.ts` · why: A domain module never reaches for infrastructure. · fix: reach it through a layer the map allows, or change the map where the boundary moved · read: docs/06-quality-checks.md#the-architecture-layer-map-pass
          baseline-ratchet  jterrazz.baseline.json › typescript  found: `architecture/domain-stays-pure` is at 1, below its baseline of 2 · why: each count is held exactly, so a debt that fell is recorded the day it falls and cannot grow back unseen · fix: run 'typescript fix', which re-records the fall · read: docs/06-quality-checks.md#what-jterrazzbaselinejson-still-holds
          ✗ Failed with exit code 1

           END  Finalizing quality checks

          ✗ Some checks failed
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  Architecture (layer map)

          src/domain/user.ts:1:22: error architecture(domain-stays-pure): found: `src/domain/user.ts` imports `src/infrastructure/store.ts` · why: A domain module never reaches for infrastructure. · fix: reach it through a layer the map allows, or change the map where the boundary moved · read: docs/06-quality-checks.md#the-architecture-layer-map-pass
          re-recorded jterrazz.baseline.json › typescript › architecture/domain-stays-pure 2 → 1
          ✓ Passed

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          jterrazz.baseline.json:
              equals: |
                  {
                      "typescript": {
                          "architecture/domain-stays-pure": 1
                      }
                  }
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  Architecture (layer map)

          ✓ Passed

           END  Finalizing quality checks

          ✓ All checks passed
