description: holds lint/ to its tree — the index alone at its root, eight folders, each rule under its family
fixture: ./fixtures/names/lint-tree/
env: TYPESCRIPT_CHECK_PASSES=names
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  Names (tree)

          names/lint-root-holds-only-index  lint/catalog.js  found: `lint/catalog.js` sits at the root of lint/ · why: lint/ has one tree in every repository — its root holds the entry the package ships, `index`, and a folder names the nature of every other file · fix: move it into the folder its nature names — catalogue, rulebook, rules, checks, ratchet, reading, self, migration — or into docs/ if it explains · read: docs/06-quality-checks.md#the-lint-tree
          names/rule-file-in-its-family-folder  lint/rules/layout/no-sleep.js  found: `lint/rules/layout/no-sleep.js` sits under `rules/layout/`, and its catalogue row gives it the family `chain` · why: a rule file sits under the folder of its family, so the tree and the catalogue say one thing · fix: move it to `rules/chain/`, or correct the family its catalogue row declares · read: docs/06-quality-checks.md#the-lint-tree
          names/rule-file-in-its-family-folder  lint/rules/no-sleep.js  found: `lint/rules/no-sleep.js` sits at the root of `rules/`, and its catalogue row gives it the family `chain` · why: a rule file sits under the folder of its family, so the tree and the catalogue say one thing · fix: move it to `rules/chain/`, or correct the family its catalogue row declares · read: docs/06-quality-checks.md#the-lint-tree
          names/lint-folder-is-known  lint/language/  found: `lint/language/` is not a folder of the lint tree · why: lint/ has one tree in every repository, so its folders are the eight that name a nature — catalogue, rulebook, rules, checks, ratchet, reading, self, migration · fix: move its files where their nature puts them — a decision on an upstream rule under rulebook/, a rule of our own under rules/<family>/, a pass under checks/, a reader they share under reading/ · read: docs/06-quality-checks.md#the-lint-tree
