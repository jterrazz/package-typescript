description: holds lint/ to its tree — index at its root, eight folders, self/ as shipped, rules by family
fixture: ./fixtures/names/lint-tree/
env: TYPESCRIPT_CHECK_PASSES=names
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  Names (tree)

          names/lint-root-holds-only-index  lint/catalog.js  found: `lint/catalog.js` sits at the root of lint/ · why: lint/ has one tree in every repository — its root holds the entry the package ships, `index`, and a folder names the nature of every other file · fix: move it into the folder its nature names — catalogue, rulebook, rules, checks, ratchet, reading, self — or into docs/ if it explains · read: docs/06-quality-checks.md#the-lint-tree
