          ✗ Failed with exit code 1

           END  Finalizing quality checks

          ✗ Some checks failed
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  Comments (styles, scripts, YAML)

          Makefile rewritten — the comments that stated no kind are deleted
          deploy/Dockerfile rewritten — the comments that stated no kind are deleted
          deploy/workflow.yaml rewritten — the comments that stated no kind are deleted
          scripts/release.sh rewritten — the comments that stated no kind are deleted
          src/page.astro rewritten — the comments that stated no kind are deleted
          src/theme.css rewritten — the comments that stated no kind are deleted
          ✓ Passed

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          Makefile:
              equals: |
                  .PHONY: build

                  build:
                  	npm run build
          deploy/Dockerfile:
              equals: |
                  # syntax=docker/dockerfile:1
                  FROM node:24-slim
                  # outside: the registry mirror refuses an image without a digest
                  COPY . .
                  RUN npm ci
          deploy/workflow.yaml:
              equals: |
                  # yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
                  name: validate
                  on: push
                  jobs:
                      validate:
                          runs-on: ubuntu-latest
                          steps:
                              - run: |
                                    # not a comment of the file: the script's own line
                                    make check
          scripts/release.sh:
              equals: |
                  #!/bin/sh
                  # shellcheck disable=SC2086
                  # hazard: the tag is pushed before the package, so a failed publish leaves a tag to delete
                  # by hand before the next run
                  set -eu
                  npm version patch
                  cat <<NOTES
                  # not a comment: the heading of the notes
                  NOTES
          src/page.astro:
              equals: |
                  ---
                  export const title = 'Home';
                  ---

                  <h1>{title}</h1>

                  <style>
                      h1 {
                          margin: 0;
                      }
                  </style>
          src/theme.css:
              equals: |
                  /*! license: kept by every minifier */
                  :root {
                      --ramp: 1.25;
                      /* value: 4px is the grid every spacing token divides */
                      --grid: 4px;
                      --icon: url(https://example.com/a//b.svg);
                      content: '/* not a comment */';
                  }
