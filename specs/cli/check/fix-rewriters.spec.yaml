description: leaves a tree that check passes, after both rewriters have run
fixture: ./__fixtures__/rewriters/lint-and-format/
runs:
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           RUN  Oxlint Fix

          ✓ Passed ({{duration}})

           RUN  Oxfmt Format

          ✓ Passed ({{duration}})

           RUN  Suppressions (directives)

          ✓ Passed ({{duration}})

           RUN  Markdown (prose)

          ✓ Passed ({{duration}})

           RUN  Names (tree)

          ✓ Passed ({{duration}})

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          index.ts:
              equals: |
                  export const label = 'x';
                  export const alpha = 1;
                  export const beta = 2;
