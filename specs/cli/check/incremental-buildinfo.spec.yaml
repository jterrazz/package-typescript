description: leaves the incremental buildinfo under .artifacts/tsc/
# The fixture spells `incremental` and `tsBuildInfoFile` itself: a temp workdir
# has no node_modules to extend the preset from, and the preset's own claim is
# specs/cli/preset/tsconfig.test.ts's. What this document states is the product
# behaviour — a check leaves its artefact in the convention's place, nowhere else.
fixture: ../../shared/fixtures/incremental-app/
runs:
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check

          jterrazz.baseline.json › typescript: nothing held
          ✓ Passed

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Publish (packaging)

          publish-test-material: nothing to judge — no @jterrazz/test resolves from this package, and what test material is is its to say
          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            jterrazz.baseline.json › typescript  absent
            tool versions                        in range

           END  Finalizing quality checks

          ✓ All checks passed
      files:
          .artifacts/tsc/tsconfig.tsbuildinfo: exists
          tsconfig.tsbuildinfo: absent
