description: leaves the incremental buildinfo under .artifacts/tsc/
fixture: ../__fixtures__/incremental-app/
env: TYPESCRIPT_CHECK_PASSES=typescript
runs:
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed ({{duration}})

           END  Finalizing quality checks

          ✓ All checks passed
      files:
          .artifacts/tsc/tsconfig.tsbuildinfo: exists
          tsconfig.tsbuildinfo: absent
