description: passes with no local knip.json, the base config covering dependencies, and keeps no knip cache
fixture: ./fixtures/knip/no-config/
runs:
    - command: check
      exit: 1
      # A knip fixture carries no tsconfig, so tsc prints its help and refuses —
      # the compiler's block, not this document's subject.
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          {{any}}

          ✗ Failed with exit code 1

           RUN  Oxlint Check

          jterrazz.baseline.json › typescript: nothing held
          ✓ Passed

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ✓ Passed

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           DRIFT  Deviations from the profile

            profile                              node (the default — no config of its own)
            rules off vs profile                 none
            suppressions                         0
            jterrazz.baseline.json › typescript  absent
            tool versions                        in range

           END  Finalizing quality checks

          ✗ Some checks failed
      files:
          # Knip runs uncached: its --cache validates a glob against the
          # directories that held a match, and misses a file added elsewhere.
          node_modules/.cache/knip: absent
