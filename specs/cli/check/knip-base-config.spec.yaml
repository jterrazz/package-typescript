description: passes with no knip.json, a render test no import reaches, and no cache
fixture: ./__fixtures__/knip/no-config/
env: TYPESCRIPT_CHECK_PASSES=knip
runs:
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  Knip (unused code)

          ✓ Passed ({{duration}})

           END  Finalizing quality checks

          ✓ All checks passed
      files:
          node_modules/.cache/knip: absent
