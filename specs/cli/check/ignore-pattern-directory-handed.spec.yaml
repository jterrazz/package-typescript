description: hands --ignore-pattern to the linter when the sweep refused and the linter is handed the directory
fixture: ./fixtures/ignore-pattern/directory-handed/
runs:
    # The fixture holds one file, under an unswept `dist/`: the sweep sees
    # nothing and refuses, so the linter is handed the directory — and only the
    # forwarded glob keeps it off `app/`. tsc has no tsconfig and prints its
    # manual, the compiler's block. The linter's pass is pinned on purpose
    # in two lines: oxlint's own, naming the cause — the glob left it no
    # file — then the judge's consequence, that no report was written.
    - command: check --ignore-pattern 'app/**'
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          {{any}}

          ✗ Failed with exit code 1

           RUN  Oxlint Check

          No files found to lint. Please check your paths and ignore patterns.
          oxlint wrote no JSON report at {{path}} — the baseline cannot be read
          ✗ Failed with exit code 1

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          ERROR: Unable to find package.json

          Run `knip --help` or visit https://knip.dev for help
          ✗ Failed with exit code 2

           RUN  Suppressions (directives)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           RUN  Markdown (prose)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           RUN  Names (tree)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           RUN  Comments (density)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           RUN  Secrets (credentials)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           DRIFT  Deviations from the profile


           END  Finalizing quality checks

          ✗ Some checks failed
      # The drift report's refusal is its own, on standard error.
      stderr: |
          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
    # Under fix the glob reaches the fixer and the run that judges what it
    # left: the file keeps its `let`, and no diagnostic of it is counted.
    - command: fix --ignore-pattern 'app/**'
      exit: 1
      stdout: |4
           START  Running quality fixes

           RUN  TypeScript Check

          {{any}}

          ✗ Failed with exit code 1

           RUN  Oxlint Fix

          No files found to lint. Please check your paths and ignore patterns.
          oxlint wrote no JSON report at {{path}} — the baseline cannot be read
          ✗ Failed with exit code 1

           RUN  Oxfmt Format

          ✓ Passed

           RUN  Suppressions (directives)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           RUN  Names (tree)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           RUN  Comments (density)

          nothing to read under {{path}}: it holds folders and no file — add the project's files, then run again
          ✗ Failed with exit code 1

           END  Finalizing quality fixes

          ✗ Some checks failed
      files:
          app/dist/scratch.ts:
              equals: |
                  let value = 1;

                  export function read(): number {
                      debugger;
                      return value;
                  }
