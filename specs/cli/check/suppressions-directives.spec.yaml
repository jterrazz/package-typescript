description: names every lint directive that is misspelled or unreasoned, and leaves a TypeScript one to oxlint
fixture: ./__fixtures__/suppressions/looking-away/
env: TYPESCRIPT_CHECK_PASSES=typescript,oxlint,suppressions
runs:
    - command: check
      exit: 1
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          ✓ Passed

           RUN  Oxlint Check
          {{any}}
          ✗ Failed with exit code 1

           RUN  Suppressions (directives)

          index.ts:1:1: error suppressions(spelled-for-this-toolchain): line 1 spells an eslint directive; this toolchain runs oxlint — 'typescript fix' rewrites it
          index.ts:4:1: error suppressions(states-its-reason): line 4 disables no-unused-vars with no '-- reason' after it
          ✗ Failed with exit code 1

           END  Finalizing quality checks

          ✗ Some checks failed
