description: re-records a member's fallen crossing count in the member's own ratchet when fix runs
fixture: ./__fixtures__/architecture-map/members-fell/
env: TYPESCRIPT_CHECK_PASSES=architecture
runs:
    - command: fix
      exit: 0
      stdout: |4
           START  Running quality fixes

           RUN  Architecture (layer map)

          re-recorded .studio/baseline.json › typescript › architecture/hexagonal-domain-is-pure from 2 to 1
          ✓ Passed ({{duration}})

           END  Finalizing quality fixes

          ✓ All checks passed
      files:
          apps/web/.studio/baseline.json:
              equals: |
                  {
                      "typescript": {
                          "architecture/hexagonal-domain-is-pure": 1
                      }
                  }
