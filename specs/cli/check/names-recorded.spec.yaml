description: records a construct name in the ratchet, and the run it records is green
fixture: ../__fixtures__/names/recorded/
env: TYPESCRIPT_CHECK_PASSES=names
runs:
    - command: baseline
      exit: 0
      stdout: |4
           TYPESCRIPT  Recording the baseline...

          .jterrazz/baseline.json › typescript written: 1 finding(s) across 1 rule(s)
    - command: check
      exit: 0
      stdout: |4
           START  Running quality checks

           RUN  Names (tree)

          ✓ Passed ({{duration}})

           END  Finalizing quality checks

          ✓ All checks passed
