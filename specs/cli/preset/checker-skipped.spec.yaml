description: skips the checker when the project does not depend on @jterrazz/test
fixture: ./fixtures/disabled/
runs:
    - command: check
      exit: 1
      # The fixture is a preset case with no tsconfig, so tsc prints its help and
      # refuses — the compiler's block, not this document's subject. The linter's
      # is spanned too: the probe's `vitest` resolves to nothing here, so the
      # default profile's type-aware rules read every call in it as `any`.
      stdout: |4
           START  Running quality checks

           RUN  TypeScript Check

          {{any}}

          ✗ Failed with exit code 1

           RUN  Oxlint Check
          {{any}}
          ✗ Failed with exit code 1

           RUN  Oxfmt Check

          ✓ Passed

           RUN  Knip (unused code)

          Unused files (1)
          probe.test.ts
          ✗ Failed with exit code 1

           RUN  Suppressions (directives)

          ✓ Passed

           RUN  Markdown (prose)

          ✓ Passed

           RUN  Names (tree)

          ✓ Passed

           RUN  Secrets (credentials)

          ✓ Passed

           END  Finalizing quality checks

          ✗ Some checks failed
