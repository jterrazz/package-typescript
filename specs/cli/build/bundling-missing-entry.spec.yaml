description: an application that publishes nothing builds src/index.ts, and fails where it is missing
fixture: ./__fixtures__/unpublished-app/
runs:
    - command: build
      exit: 1
      stdout: |4
           TYPESCRIPT  Building the entries the manifest publishes...

          ℹ tsdown v{{semver}} powered by rolldown v{{semver}}
          ℹ config file: {{path}} 
          ℹ entry: src/index.ts
          ℹ tsconfig: tsconfig.json
          ℹ Build start
          error TS6053: File '{{workdir}}/src/index.ts' not found.
            The file is in the program because:
              Part of 'files' list in tsconfig.json
          found: tsdown could not build the project; its own report is above · why: dist/ is what `start` runs and what the package publishes, and a build that stopped part-way leaves it stale · fix: repair what tsdown names above, then run the build again · read: docs/reference/building.md#a-build-that-fails
      stderr: |-
          {{any}}
           ERROR  Error: Build failed with 1 error:

          [plugin rolldown-plugin-dts:generate]
          {{any}}
