description: an application with no manifest target builds its index beside the entries it declares
fixture: ./_fixtures/app-with-entries/
runs:
    - command: build
      exit: 0
      stdout: |4
           TYPESCRIPT  Building the entries the manifest publishes...

          ℹ tsdown v{{semver}} powered by rolldown v{{semver}}
          ℹ config file: {{path}} 
          ℹ entry: src/index.ts, src/worker.ts
          ℹ tsconfig: tsconfig.json
          ℹ Build start
          {{any}}
          Build completed
      files:
          dist/index.js: { contains: 'Hello from the app' }
          dist/worker.js: { contains: 'answered by the worker' }
