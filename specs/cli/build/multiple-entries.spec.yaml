description: compiles each published subpath and bin from the entry its grammar names, with no config
fixture: ./_fixtures/multi-entry/
runs:
    - command: build
      exit: 0
      stdout: |4
           TYPESCRIPT  Building the entries the manifest publishes...

          ℹ tsdown v{{semver}} powered by rolldown v{{semver}}
          ℹ config file: {{path}} 
          ℹ entry: src/index.ts, src/index.register.ts, src/greet.bin.ts
          ℹ tsconfig: tsconfig.json
          ℹ Build start
          {{any}}
          Build completed
      files:
          dist/index.js: { contains: 'Hello, ' }
          dist/register.js: { contains: 'registered' }
          dist/greet.js: { contains: '#!/usr/bin/env node' }
          dist/index.register.js: absent
          dist/greet.bin.js: absent
