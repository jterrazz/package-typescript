description: refuses a TYPESCRIPT_CAPACITY that names no capacity, before any run
fixture: ../__fixtures__/names/empty-directories/
env: TYPESCRIPT_CAPACITY=many
runs:
    - command: mutation
      exit: 1
      stdout: |
          found: TYPESCRIPT_CAPACITY is many, which names no capacity · why: a capacity read wrong would size every pool of the gate from a machine that is not there · fix: write it cpus=<count>,memory=<size> (cpus=4,memory=8g), either part alone, or leave it unset to take this gate's share of the machine · read: docs/reference/quality-checks.md#how-many-test-runners

          ✗ Mutation failed: refused before any run: TYPESCRIPT_CAPACITY is many, which names no capacity
