description: says it measured nothing in a project with no test project, and fails on nothing
fixture: ../__fixtures__/names/empty-directories/
runs:
    - command: mutation
      exit: 0
      stdout: |4
           TYPESCRIPT  measured nothing: {{workdir}} holds no module test and no specs/, so no test project to run a mutant against.

          ✓ Mutation passed — measured nothing: {{workdir}} holds no module test and no specs/, so no test project to run a mutant against
      files:
          .artifacts/gate/verdict.json:
              equals: |
                  {
                      "command": "mutation",
                      "head": null,
                      "mutation": null,
                      "passes": [],
                      "status": 0
                  }
