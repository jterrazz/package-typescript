description: refuses an unknown command above the help banner, a name the command table inherits included
runs:
    - command: unknown
      exit: 1
      stdout: |4
           TYPESCRIPT  TypeScript toolchain

          found: no command named unknown · why: the toolchain answers only the commands it declares · fix: run one of the commands below · read: docs/02-developing.md#3-wire-the-cli-into-packagejson

          Usage: typescript <command>

          Commands:
            build        Build application (ESM + types)
            bundle       Bundle library (ESM + CJS + types)
            start        Run the built application
            dev          Build, run, and rebuild on changes
            docs-layout  Check a repository's docs/ against the manual spine
            doctor       Report the installed tool versions against the declared ranges
            baseline     Record the lint debt in oxlint-suppressions.json, Names and Comments in jterrazz.baseline.json
            tsc          Run the TypeScript 7 compiler this package ships (emit, --build)
            check        Check types, lint, formatting, and unused code
            fix          Auto-fix lint and formatting issues
            clean        Remove .artifacts/ — dist/ stays, it is the build's product

          Examples:
            typescript build
            typescript bundle
            typescript start
            typescript dev
            typescript docs-layout .
            typescript doctor
            typescript baseline
            typescript tsc --build
            typescript check
            typescript fix
            typescript clean
    - command: constructor
      exit: 1
      stdout: |4
           TYPESCRIPT  TypeScript toolchain

          found: no command named constructor · why: the toolchain answers only the commands it declares · fix: run one of the commands below · read: docs/02-developing.md#3-wire-the-cli-into-packagejson

