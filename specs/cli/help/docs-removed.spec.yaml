description: refuses `docs` above the help banner — the API reference compiler it ran is gone
runs:
    - command: docs
      exit: 1
      stdout: |4
           TYPESCRIPT  TypeScript toolchain

          found: no command named docs · why: the toolchain answers only the commands it declares · fix: run one of the commands below · read: docs/start/getting-started.md#3-wire-the-cli-into-packagejson

          Usage: typescript <command> [flags]

          Commands:
            build        Build the entries the manifest publishes, as its conditions ask
            start        Run the built application
            dev          Build, run, and rebuild on changes
            docs-layout  Check a repository's docs/ against the manual's shape
            doctor       Report the installed tool versions against the declared ranges, and the file every setting comes from
            mutation     Measure the tests against mutants of the lines the change reaches (--mutate <ranges> names others)
            baseline     Record the debt: oxlint's in .jterrazz/oxlint-suppressions.json, the rest in .jterrazz/baseline.json
            tsc          Run the TypeScript 7 compiler this package ships (emit, --build)
            check        Check types, lint, formatting, and unused code
            fix          Auto-fix lint and formatting issues
            test         Run the project's test script, unless this tree is proven green for it
            gate-lock    Refuse while a running gate holds this checkout, naming its pid: the guard an install or a pack runs first
            rehearse     Run the gate on Linux in Docker, on a fresh clone of the branch, as a GitHub runner runs it
            clean        Remove .artifacts/; dist/ stays, as the build's product

          Examples:
            typescript build
            typescript start
            typescript dev
            typescript docs-layout .
            typescript doctor
            typescript mutation
            typescript baseline
            typescript tsc --build
            typescript check
            typescript fix
            typescript test
            typescript gate-lock
            typescript rehearse
            typescript clean

          A command's flags: typescript <command> --help
