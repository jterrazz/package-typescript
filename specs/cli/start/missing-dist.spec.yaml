description: fails when dist does not exist
fixture: $FIXTURES/sample-app/
runs:
    - command: start
      exit: 1
      # Node's own refusal: the loader frames, its line numbers and the runtime
      # banner move with every Node release, so only the sentence that names the
      # missing artifact is stated.
      stderr: |-
          {{any}}
          Error: Cannot find module '{{workdir}}/dist/index.js'
          {{any}}
