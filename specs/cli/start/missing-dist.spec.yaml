description: fails when dist does not exist
fixture: ../__fixtures__/sample-app/
runs:
    - command: start
      exit: 1
      # outside: Node owns the loader's stack frames and the version line, whose text moves between minors; the module named and the error's code are the spec's.
      stderr: |
          {{any}}
          Error: Cannot find module '{{workdir}}/dist/index.js'
          {{any}}
            code: 'MODULE_NOT_FOUND',
            requireStack: []
          }

          Node.js v{{semver}}
