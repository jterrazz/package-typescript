description: stamps every generated file with the do-not-edit header
fixture: $FIXTURES/sample-documented/
runs:
    - command: docs
      exit: 0
      stdout: |4
           TYPESCRIPT  Generating API docs...

          [info] Loaded plugin typedoc-plugin-markdown
          [info] markdown generated at ./docs/reference
          Generated docs/reference/

          Docs generated at docs/
      files:
          docs/reference/index.md:
              { contains: '<!-- GENERATED by `typescript docs` — DO NOT EDIT -->' }
          docs/reference/functions/greet.md:
              { contains: '<!-- GENERATED by `typescript docs` — DO NOT EDIT -->' }
